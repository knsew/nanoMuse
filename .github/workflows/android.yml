name: Android

# A debug APK (arm64-v8a) for every push and pull request that touches the
# Android tree. Debug-signed only: no keystore and no secrets are involved.
# A release tag builds the signed release APK and attaches it to the release
# of the same name; the fork's release keystore comes from the repository
# secrets, never from the tree.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NDK_VERSION: 27.2.12479018

jobs:
  # The path filter is a job, not `on.push.paths`, so the build is reported as skipped rather
  # than absent when the Android tree is untouched: branch protection requires this check,
  # and a check that never reports would block every docs-only pull request.
  changes:
    name: what changed
    # Tag pushes skip the path filter: the release job runs on every tag, and the
    # debug build is a push-to-main job.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - "android/**"
              - "scripts/android/**"
              - "scripts/rebrand.py"
              - "scripts/gen-android-icons.py"
              - ".github/workflows/android.yml"

  debug-apk:
    name: debug APK · arm64-v8a
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # android/deps/proot (our fork)

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # gomobile@latest wants the current Go; GOTOOLCHAIN=auto below lets `go` fetch a
          # newer one when it asks for it (setup-go v6+ pins the toolchain otherwise).
          go-version: "1.26"
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;${{ env.NDK_VERSION }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Native artifacts (proot, Alpine rootfs, rclone.aar)
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export GOROOT="$(go env GOROOT)" GOPATH="$(go env GOPATH)"
          export PATH="$GOPATH/bin:$PATH" # gomobile / gobind land there
          bash scripts/android/build-natives.sh

      - name: assembleDebug
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      # Our unit tests (io.github.nanomuse.*: the guards, the hub client, the sandbox paths, the
      # strings' parity), plus the upstream provider and sandbox tests, the two OpenMinis packages
      # our edits touch (#333, #334, #335). Same Gradle invocation as AGENTS.md; the compiled
      # classes are warm.
      - name: Unit tests
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:testDebugUnitTest --tests 'io.github.nanomuse.*' \
            --tests 'com.openminis.app.provider.*' --tests 'com.openminis.app.sandbox.*' \
            --console=plain --no-daemon

      # The on-device tests cannot run here (no emulator), but the source set must keep
      # compiling or io.github.nanomuse.reach.ReachHubInstrumentedTest never runs anywhere (#332).
      - name: androidTest compiles
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:compileDebugAndroidTestKotlin --console=plain --no-daemon

      - name: Badging
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/aapt" dump badging android/src/android/app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:|application-label:|native-code"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nanoMuse-debug-apk
          path: android/src/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  release-apk:
    name: release APK · arm64-v8a
    # A signed release APK for the release of the same tag: the tag push is the
    # only trigger. The keystore and its passwords come from the repository
    # secrets; the signature is checked against the fork's release certificate
    # before anything is attached, so a debug-signed or wrong-key build never
    # reaches the release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # android/deps/proot (our fork)

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # gomobile@latest wants the current Go; GOTOOLCHAIN=auto below lets `go` fetch a
          # newer one when it asks for it (setup-go v6+ pins the toolchain otherwise).
          go-version: "1.26"
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;${{ env.NDK_VERSION }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The fork's release keystore, decoded from the secret into the tree (git-ignored,
      # like the properties file); build.gradle.kts signs the release build with it when
      # android/keystore.properties exists, and falls back to the debug key otherwise,
      # which the signature check below refuses.
      - name: The release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/nanomuse-release.keystore
          [ -s android/nanomuse-release.keystore ] || { echo "the decoded keystore is empty" >&2; exit 1; }
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/android/nanomuse-release.keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Native artifacts (proot, Alpine rootfs, rclone.aar)
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export GOROOT="$(go env GOROOT)" GOPATH="$(go env GOPATH)"
          export PATH="$GOPATH/bin:$PATH" # gomobile / gobind land there
          bash scripts/android/build-natives.sh

      - name: assembleRelease
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleRelease --console=plain --no-daemon

      # The APK must carry the tag's version and the fork's release certificate.
      - name: The signature is the fork's release key
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk=android/src/android/app/build/outputs/apk/release/app-release.apk
          version="${GITHUB_REF_NAME#v}"
          "$bt/aapt" dump badging "$apk" | grep -E "^package:|application-label:" | head -2
          "$bt/aapt" dump badging "$apk" | grep -q "versionName='$version'" || {
            echo "the APK is not versionName $version" >&2; exit 1; }
          certs="$("$bt/apksigner" verify --print-certs "$apk")"
          # Display only: build-tools 37 renamed the apksigner label from
          # "Signer #1 certificate" to "V2 Signer: certificate", so match
          # the tail both formats share and never fail the step here; the
          # fingerprint check below is the real gate.
          echo "$certs" | grep -E "certificate (DN|SHA-256)" || true
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "signed with the debug key" >&2; exit 1
          fi
          expected="91:3A:48:A6:62:C3:CC:F7:F2:83:C3:4D:D5:F5:FC:EB:9C:4C:9B:85:86:48:BE:7D:CC:79:8D:59:0A:CD:98:4B"
          expected="$(echo "$expected" | tr -d ':' | tr 'A-Z' 'a-z')"
          echo "$certs" | grep -q "SHA-256 digest: $expected" || {
            echo "the certificate is not the fork's release key" >&2; exit 1; }

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          apk=android/src/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp "$apk" "dist/nanoMuse-$version-arm64.apk"
          (cd dist && sha256sum "nanoMuse-$version-arm64.apk" > "nanoMuse-$version-arm64.apk.sha256" && cat "nanoMuse-$version-arm64.apk.sha256")
          # the release is created right after the tag is pushed;
          # give it up to fifteen minutes
          for i in $(seq 1 90); do
            if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release view "$TAG" -R "$REPO" >/dev/null
          gh release upload "$TAG" "dist/nanoMuse-$version-arm64.apk" "dist/nanoMuse-$version-arm64.apk.sha256" -R "$REPO" --clobber
